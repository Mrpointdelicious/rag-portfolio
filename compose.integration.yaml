services:
  api:
    volumes:
      - ./data:/app/data
    environment:
      RAG_POSTGRES_HOST: rag-portfolio-postgres-1
      RAG_QDRANT_URL: http://rag-portfolio-qdrant-1:6333
      TIKTOKEN_CACHE_DIR: /app/data/tokenizers
    networks:
      default:
      metaagent:
        aliases: [rag-portfolio-api]
  worker:
    volumes:
      - ./data:/app/data
    environment:
      RAG_POSTGRES_HOST: rag-portfolio-postgres-1
      RAG_QDRANT_URL: http://rag-portfolio-qdrant-1:6333
      TIKTOKEN_CACHE_DIR: /app/data/tokenizers

networks:
  metaagent:
    external: true
    name: metaagent-runtime_default
